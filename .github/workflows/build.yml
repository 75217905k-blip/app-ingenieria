name: Compilar APK Android con Buildozer

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v3

    - name: Configurar entorno de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython==0.29.33

    - name: Compilar APK con Buildozer
      run: |
        yes y | buildozer --allow-root android debug

    - name: Guardar la APK generada como artefacto
      uses: actions/upload-artifact@v3
      with:
        name: MiApp-Android-APK
        path: bin/*.apk
